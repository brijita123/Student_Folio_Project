<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Folio</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="/">Student Folio</a>
  <main class="auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Login</h1>
    <p class="muted">Enter your account details to continue.</p>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required placeholder="Your password">
      <button class="button full" type="submit">Login</button>
      <p id="message" class="message" aria-live="polite"></p>
    </form>
    <p class="switch-link">New here? <a href="/register.html">Create an account</a></p>
  </main>
  <footer>© 2026 Student Folio</footer>
</body>
</html>
